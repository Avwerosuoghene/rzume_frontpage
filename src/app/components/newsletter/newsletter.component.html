<div class="newsletter-card">
  <h3 class="newsletter-heading">Get job search tips and product updates</h3>
  
  <app-newsletter-form
    #newsletterForm
    [analyticsLocation]="analyticsLocation"
  >
    <div class="newsletter-field">
      <button
        type="submit"
        name="SIGNUP_SUBMIT_BUTTON"
        id="zcWebOptin"
        class="newsletter-submit"
        [disabled]="newsletterForm.submitState() === 'pending'"
      >
        {{ newsletterForm.submitState() === 'pending' ? 'Submitting…' : 'Subscribe' }}
      </button>
    </div>
  </app-newsletter-form>
</div>
