<div class="newsletter-modal">
  <button
    mat-icon-button
    class="newsletter-modal__close"
    (click)="onDismiss()"
    type="button"
    aria-label="Close"
  >
    <mat-icon>close</mat-icon>
  </button>

  <h2 class="newsletter-modal__title">Hey you!</h2>
  <p class="newsletter-modal__subtitle">
    Be the first to get news updates, and tips about job applications
  </p>

  <app-newsletter-form-iframe class="newsletter-modal__form" height="240px"></app-newsletter-form-iframe>
</div>
